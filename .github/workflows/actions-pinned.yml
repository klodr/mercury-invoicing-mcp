name: Actions pinned

# Triggers on EVERY PR (no `paths:` filter). When used as a required
# status check in branch protection, a `paths:` filter would cause
# GitHub to skip creating a run on unrelated PRs and leave the check
# in a perpetual "Pending" state, blocking merges. The pinact check
# itself is fast (~5s on a clean repo), so always running it is
# cheaper than dealing with the required-check skip semantics.
on:
  pull_request:

permissions: {}

jobs:
  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require digest-pinned docker:// actions
        # pinact only checks `uses:` values of the form `owner/repo@ref` and
        # skips the rest, so `docker://image:tag` would pass unnoticed (and
        # Dependabot does not update docker:// references). Every docker://
        # action must carry a full sha256 digest.
        run: |
          set -euo pipefail
          bad=$(grep -rnE '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*["'"'"']?docker://' .github/workflows .github/actions 2>/dev/null \
            | grep -vE 'docker://[^[:space:]@"'"'"']+@sha256:[0-9a-f]{64}' || true)
          if [ -n "$bad" ]; then
            echo "::error::docker:// action not pinned by a full sha256 digest:"
            echo "$bad"
            exit 1
          fi
          echo "every docker:// action is pinned by digest"

      - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          # `version` was removed in pinact-action v2: the pinact binary
          # is now bundled with the action tag, so the action SHA above
          # is the only thing pinning the pinact version.
          skip_push: "true"
        env:
          GITHUB_TOKEN: ${{ github.token }}
